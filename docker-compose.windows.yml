# ── Windows Docker Desktop variant ─────────────────────────────
# network_mode: host is NOT supported on Docker Desktop for Windows.
# This file uses explicit port mapping instead.
#
# IMPORTANT: Connect your Windows PC to the car's WiFi FIRST,
# then start the container. The container reaches 172.16.11.1
# through Docker's NAT gateway.
#
# Usage:
#   docker compose -f docker-compose.windows.yml up --build

services:
  fpv-cockpit:
    build: .
    image: wltoys-fpv-cockpit:latest
    container_name: fpv-cockpit
    ports:
      - "5555:5555"           # Web UI
      - "1234:1234/udp"       # Video stream from car
    environment:
      - FPV_CAR_IP=172.16.11.1
      - FPV_LISTEN_PORT=1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
